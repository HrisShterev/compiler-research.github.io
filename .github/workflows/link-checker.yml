name: Check broken links

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@8575951200e472d5f2d95c625da0c7bec8217c42
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check for broken links
        uses: athackst/htmlproofer-action@main
        with:
          directory: '_site'

          check_images: false
          check_scripts: false
          check_opengraph: false
          
          user_agent: "Mozilla/5.0"
          # Redirects, bot blocks, timeouts, and common external failures
          ignore_status_codes: '301,302,403,429,403,500,502,503,504,999,0'

          check_internal_hash: false
          check_external_hash: false
          ignore_missing_alt: true
          ignore_empty_alt: true
          allow_missing_href: true

          # Silence HTTP enforcement — too many old blog links
          enforce_https: false

          # Only check internal links — external sites are unreliable in CI
          ignore_urls: '^http://,^https://,^//'
          
          ignore_urls: |
            ^https://compiler-research.org/clad/#:~:text=
            ^https://compiler-research.org/stories/#:~:text=
            ^https://summerofcode.withgoogle.com/media/user/.*\.pdf$
            ^https://content.sciendo.com/view/journals/cait/20/1/article-p53\.xml$
